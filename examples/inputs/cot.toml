[molecule]
xyz = "../COT.xyz" # Paths are relative to this input file.
basis = "cc-pvdz"
charge = 0
multiplicity = 1

[calculation]
backend = "jax"
device = "cpu" # Change to "gpu" on the supercomputer.
energy_evaluation = "determinant"
initial_guess = "hf"

[active_space]
mode = "pi"
pi_electrons = 8
optimize_core = true

[output]
path = "cot_active.json"
