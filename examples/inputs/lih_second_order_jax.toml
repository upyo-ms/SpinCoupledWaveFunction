# Optional JAX Hessian; the default second_order_backend remains "analytic".
[molecule]
atom = "Li 0 0 0; H 0 0 1.6"
basis = "sto-3g"

[calculation]
backend = "jax"
device = "cpu"
energy_evaluation = "determinant"
initial_guess = "hf"

[active_space]
inactive_mos = [1]
active_mos = [2, 3]
optimize_core = false

[optimizer]
method = "simultaneous"
second_order = true
second_order_backend = "jax"

[output]
path = "lih_second_order_jax.json"
