[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scgvb"
version = "0.1.0"
description = "Spin-coupled generalized valence bond calculations with nonorthogonal orbitals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pyscf>=2.8,<3",
    "sympy>=1.13,<2",
    "matplotlib>=3.9,<4",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
geometry = ["geometric>=1.1,<2", "Py-BOBYQA>=1.5,<2"]
jax = ["jax==0.11.2"]
cuda13 = ["jax[cuda13]==0.11.2"]

[project.scripts]
scgvb-calculate = "scgvb.cli.molecule:main"
scgvb-diatomic = "scgvb.cli.diatomic:main"
scgvb-orbitals = "scgvb.io.orbitals:main"
scgvb-population = "scgvb.analysis.population:main"

[tool.setuptools.packages.find]
include = ["scgvb", "scgvb.*"]

[tool.setuptools.package-data]
"scgvb.io" = ["orbital_viewer.html"]
