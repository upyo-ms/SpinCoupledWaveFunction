[molecule]
xyz = "./examples/thiophene.xyz"
basis = "cc-pvdz"
multiplicity = 1

[calculation]
backend = "jax"
device = "cpu"
energy_evaluation = "determinant"
initial_guess = "hf"

[active_space]
mode = "pi"
pi_electrons = 6 
pi_normal_mode = "local"
optimize_core = false

[output]
path = "thiophene_active.json"
